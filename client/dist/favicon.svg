<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Academic Graduation Cap Emblem -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Cap Diamond Top -->
    <polygon points="256,120 420,200 256,280 92,200" fill="url(#capGrad)"/>
    
    <!-- Cap Skull Base -->
    <path d="M160,250 L160,330 C160,360 200,380 256,380 C312,380 352,360 352,330 L352,250 L256,300 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Tassel String & Knot -->
    <circle cx="256" cy="200" r="10" fill="#6366f1"/>
    <path d="M256,200 Q390,220 390,300" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="390" cy="310" r="14" fill="#f59e0b"/>
  </g>
</svg>
